services:
  server:
    container_name: dezapeguei-container
    restart: always
    networks:
      - celo-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dezapeguei.rule=Host($${DOMAIN_NAME})"
      - "traefik.http.routers.dezapeguei.entrypoints=websecure"
      - "traefik.http.routers.dezapeguei.tls.certresolver=myresolver" 
      - "traefik.http.services.dezapeguei.loadbalancer.server.port=8081"
      - "traefik.docker.network=celo-network" 
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DATABASE_URL: ${DATABASE_URL}
    environment:
      NODE_ENV: production
      PORT: 8081
      TZ: America/Sao_Paulo
      APP_TIMEZONE: America/Sao_Paulo
      DATABASE_URL: ${DATABASE_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      JWT_SECRET: ${JWT_SECRET}
      MAILGUN_API_KEY: ${MAILGUN_API_KEY}
      MAILGUN_DOMAIN: ${MAILGUN_DOMAIN}
      GROQ_API_KEY: ${GROQ_API_KEY}
      REDIS_DB: ${REDIS_DB}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_URL: ${REDIS_URL}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
    command: ["npm", "start"]

networks:
  celo-network:
    external: true