services:
  redis:
    image: redis:alpine
    container_name: redis-fc-container
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - ./data:/data

  server:
    container_name: falacomigo-container
    restart: always
    depends_on:
      - redis
    networks:
      - proxy-public
      - default 
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.fala.rule=Host(`server.falacomigo.space`)"
      - "traefik.http.routers.fala.entrypoints=websecure"
      - "traefik.http.routers.fala.tls.certresolver=myresolver" 
      - "traefik.http.services.fala.loadbalancer.server.port=8080"
      - "traefik.docker.network=proxy-public" 
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DATABASE_URL: ${DATABASE_URL}
    environment:
      NODE_ENV: production
      PORT: 8080
      TZ: America/Sao_Paulo
      APP_TIMEZONE: America/Sao_Paulo
      DATABASE_URL: ${DATABASE_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      JWT_SECRET: ${JWT_SECRET}
      MAILGUN_API_KEY: ${MAILGUN_API_KEY}
      MAILGUN_DOMAIN: ${MAILGUN_DOMAIN}
      GROQ_API_KEY: ${GROQ_API_KEY}
      REDIS_DB: ${REDIS_DB}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_URL: ${REDIS_URL}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
    command: ["npm", "start"]

  traefik:
    image: traefik:v3.6
    container_name: traefik
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.myresolver.acme.httpchallenge=true"
      - "--certificatesresolvers.myresolver.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.myresolver.acme.email=${LETSENCRYPT_EMAIL}"
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./letsencrypt:/letsencrypt" 
    networks:
      - proxy-public

networks:
  proxy-public:
    driver: bridge